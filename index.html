<!-- index.html -->
<!doctype html>
<html lang="ar" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purchase Order</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Purchase order</h1>
      <form id="PurchaseOrderForm">
        <div class="data-supplier">
          <div class="input-container">
            <label>Order Number</label>
            <input type="text" id="orderNumber" value="VF-PR-008-26" required />
          </div>

          <div class="input-container">
            <label>Company name</label>
            <input
              type="text"
              id="companyName"
              value="YEMEN AGRO GOR TRADE"
              required
            />
          </div>

          <div class="input-container">
            <label>Contact name</label>
            <input type="text" id="contactName" value="MR.SADIQ" required />
          </div>

          <div class="input-container">
            <label>Contact number</label>
            <input
              type="text"
              id="contactNumber"
              value="+967 772 222 459"
              required
            />
          </div>

          <div class="input-container">
            <label>Email</label>
            <input
              type="email"
              id="emailID"
              value="example@gmail.com"
              required
            />
          </div>
        </div>
        <hr />
        <div class="my-data">
          <div class="input-container">
            <label>Orderd by</label>
            <input
              type="text"
              value="Mr.Mohammed Qasem"
              id="orderdBy"
              required
            />
          </div>

          <div class="input-container">
            <label>Phone</label>
            <input type="text" id="phone" value="+971 523 433 321" required />
          </div>

          <div class="input-container">
            <label>Email</label>
            <input type="text" id="email" value="mohammed@gmail.com" required />
          </div>

          <div class="input-container">
            <label>Purchase order date</label>
            <input type="date" id="poDate" required />
          </div>

          <div class="input-container">
            <label>Delivery date</label>
            <input type="date" id="deliveryDate" required />
          </div>

          <div class="input-container">
            <label>Company logo</label>
            <input type="file" id="logoUpload" accept="image/*" required />
          </div>
        </div>

        <hr />

        <div>
          <button type="button" onclick="addRow()">Add New Row</button>
          <button type="button" class="removeRowBtn" onclick="removeRow()">
            Remove Row
          </button>
        </div>

        <table id="invoiceTable">
          <thead>
            <tr>
              <th>#Sr</th>
              <th>Code</th>
              <th>Item Description</th>
              <th>Qty</th>
              <th>Total Weight</th>
              <th>Unit</th>
              <th>Unit Price</th>
              <th>Sub Total</th>
            </tr>
          </thead>

          <tbody id="tableBody">
            <tr>
              <td>1</td>

              <td>
                <input type="text" class="codeNum" name="code[]" />
              </td>

              <td>
                <textarea
                  type="text"
                  class="descriptionItem"
                  name="description[]"
                ></textarea>
              </td>

              <td>
                <input type="number" class="qty" min="1" step="any" value="1" />
              </td>

              <td>
                <input
                  type="number"
                  class="total-weight"
                  min="1"
                  step="any"
                  value="1"
                />
              </td>

              <td>
                <input type="text" class="unitItem" name="unit[]" />
              </td>

              <td>
                <input
                  type="number"
                  class="price"
                  min="0"
                  value="0"
                  step="any"
                />
              </td>

              <td>
                <input type="text" class="subtotal" readonly value="0" />
              </td>
            </tr>
          </tbody>
        </table>

        <br />
        <div class="currency">
          <label>Currency</label>
          <select name="currency[]" id="currency">
            <option value="$">$ USD</option>
            <option value="AED">AED</option>
            <option value="€">€ EUR</option>
          </select>
        </div>

        <h4 class="total-amount">
          Amount:
          <span id="totalAmount">0</span>
        </h4>

        <h4 class="vat-amount">
          VAT 5%:
          <input id="vatAmount" type="number" step="any" value="0" />
        </h4>

        <h4 class="total-amount-2">
          Total Amount:
          <span id="totalAmount2">0</span>
        </h4>

        <h4 class="amount-in-words">
          <span>Amount in words:</span>
          <input id="amountInWords" type="text" />
        </h4>

        <div>
          <button type="button" onclick="addCondition()">Add New Condition</button>
          <button type="button" class="removeRowBtn" onclick="removeCondition()">
            Remove Condition
          </button>
        </div>

        <table class="terms-table">
          <thead>
            <tr>
              <th>#Sr</th>
              <th>Terms and Conditions:</th>
            </tr>
          </thead>
          <tbody id="termsBody">
            <tr>
              <td>1</td>
              <td>
                <textarea
                  type="text"
                  class="descriptionItem"
                  name="terms[]"
                >all orders must be delivered as mentioned in the PO above</textarea>
              </td>
            </tr>
            <tr>
              <td>2</td>
              <td>
                <textarea
                  type="text"
                  class="descriptionItem"
                  name="terms[]"
                >Invoice should be issued under the name of the LPO issuer</textarea>
              </td>
            </tr>
            <tr>
              <td>3</td>
              <td>
                <textarea
                  type="text"
                  class="descriptionItem"
                  name="terms[]"
                >All Goods must received in good shape and condition (Grade A as Agreed)</textarea>
              </td>
            </tr>
            <tr>
              <td>4</td>
              <td>
                <textarea
                  type="text"
                  class="descriptionItem"
                  name="terms[]"
                >Payment Term - CREDIT</textarea>
              </td>
            </tr>
          </tbody>
        </table>

        <button type="submit">Submit</button>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
